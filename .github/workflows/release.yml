name: Release

# Push a tag like v1.2.0 to publish a signed installer as a GitHub release.
# Run manually (workflow_dispatch) to get an installer artifact without a release;
# a manual run is left unsigned when signing is not configured yet.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  HAS_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' && secrets.AZURE_TENANT_ID != '' }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          else { $v = "0.0.$env:GITHUB_RUN_NUMBER" }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Tag must look like v1.2.3 (got '$env:GITHUB_REF_NAME')." }
          "version=$v" >> $env:GITHUB_OUTPUT
          "Version $v"

      - name: Require signing for tagged releases
        if: github.ref_type == 'tag' && env.HAS_SIGNING != 'true'
        shell: pwsh
        run: throw "Signing is not configured (AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET secrets). See README."

      - name: Test
        run: dotnet test HomeFocus.sln -c Release

      - name: Publish
        run: >
          dotnet publish src/HomeFocus.App/HomeFocus.App.csproj -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -p:Version=${{ steps.version.outputs.version }} -o publish

      - name: Sign app
        if: env.HAS_SIGNING == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: ${{ github.workspace }}\publish\HomeFocus.exe
          description: HomeFocus

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=${{ steps.version.outputs.version }}" "/DPublishDir=..\publish" installer\HomeFocus.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Sign installer
        if: env.HAS_SIGNING == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\HomeFocus-Setup-${{ steps.version.outputs.version }}.exe
          description: HomeFocus Setup

      - name: Verify signatures
        if: env.HAS_SIGNING == 'true'
        shell: pwsh
        run: |
          foreach ($f in @("publish\HomeFocus.exe", "dist\HomeFocus-Setup-${{ steps.version.outputs.version }}.exe")) {
            $s = Get-AuthenticodeSignature $f
            "$f : $($s.Status) ($($s.SignerCertificate.Subject))"
            if ($s.Status -ne 'Valid') { throw "$f is not validly signed" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: HomeFocus-Setup-${{ steps.version.outputs.version }}
          path: dist/*.exe

      - name: GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME "dist\HomeFocus-Setup-${{ steps.version.outputs.version }}.exe" --title "HomeFocus ${{ steps.version.outputs.version }}" --generate-notes
